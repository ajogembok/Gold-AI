<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold AI</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}
.card{
    background:#1d1d1d;
    border-radius:15px;
    padding:20px;
}
h1{
    text-align:center;
    color:gold;
}
.item{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
    font-size:18px;
}
.buy{color:#00ff66;}
.sell{color:#ff4444;}
.wait{color:orange;}
.score{
    text-align:center;
    font-size:40px;
    color:gold;
    margin:20px 0;
}
</style>

</head>

<body>

<div class="card">

<h1>🟡 GOLD AI</h1>

<div class="score">
82%
</div>

<div class="item">
<span>Status</span>
<span class="buy">BUY</span>
</div>

<div class="item">
<span>DXY</span>
<span class="sell">Bearish</span>
</div>

<div class="item">
<span>Retail</span>
<span>72% BUY</span>
</div>

<div class="item">
<span>Smart Money</span>
<span class="buy">BUY</span>
</div>

<div class="item">
<span>Open Interest</span>
<span class="buy">Naik</span>
</div>

<div class="item">
<span>Update</span>
<span>Live</span>
</div>

</div>

</body>
</html>
